      function applyTemplate(name){const templates={學期平衡週:[['深度學習時段','學習成長','09:00',90],['課程整理','行政瑣事','14:00',45],['運動與休息','健康休息','17:00',40]],轉學考讀書日:[['微積分練習','深度工作','08:30',100],['管理學回想測驗','學習成長','13:30',60],['錯題訂正','深度工作','19:00',60]],低負荷恢復日:[['本週檢視','行政瑣事','10:00',30],['散步與伸展','健康休息','16:00',40]]};(templates[name]||[]).forEach((r,i)=>store.tasks.push({...makeTask(Date.now()+i,0,r[0],'個人計畫',r[1],r[2],r[3],'todo'),id:crypto.randomUUID?.()||String(Date.now()+i),date:selectedDate.value}));notify(`${name}已套用`);page.value='workbench'}
      function onResize(){chartInstances.forEach(c=>c.resize())}
      watch([page,activeChartTab,period,selectedDate],()=>{if(page.value==='dashboard')drawCharts()});

      return {hasChartData,store,page,collapsed,showModal,draft,editId,nav,calendarMonth,calendarSelectedDate,calendarDates,calendarMonthTasks,selectedCalendarTasks,importedTasks,importedUnscheduled,importReport,moveImportMonth,selectImportDate,importedForDate,openImportCalendar,chartTabs,researchTopics,logDraft,timeTypeLabels,dayLogs,dayLogStats,reviewWindow,reviewStart,reviewLogs,dailyReview,reviewMaxMinutes,reviewStats,typeReview,deadlineReview,reviewHints,logDuration,validActivityLog,resetLogDraft,saveActivityLog,removeActivityLog,exportActivityCSV,dayBudgetFields,dayBudgetDraft,dayBudgetTotal,dayBudgetRemaining,completedTasks,meanEstimateBias,meanAbsoluteEstimateError,activeChartTab,period,filterStatus,filterProject,search,selectedDate,toast,timerSeconds,timerRunning,timerMode,timerText,scopedTasks,todayTasks,filteredTasks,projects,doneToday,completion,scheduledMinutes,actualTotal,hours,cards,openNew,editTask,saveTask,removeTask,cycleStatus,toggleTimer,resetTimer,downloadChart,saveJSON,importJSON,exportCSV,exportICS,importICS,exportPDF,resetAll,applyTemplate,saveDayBudget,notify,chartInstances};
    },
    template:`
      <div class="app" :class="{dark:store.settings.theme==='dark'}">

          <div class="side-bottom"><button class="nav-btn" @click="collapsed=!collapsed"><span class="nav-icon">{{collapsed?'⇥':'⇤'}}</span><span class="nav-text">收合側欄</span></button><div class="side-help">Chrono Desk<br/>把時間安排，變成看得見的進度。</div></div>
        </aside>
        <main class="main">
          <header class="topbar"><div class="crumb">工作空間　/　<b>{{nav.find(n=>n.id===page)?.label}}</b></div><div class="top-actions"><div class="top-kpi"><span>今日任務<strong>{{doneToday}} / {{todayTasks.length}}</strong></span><span>完成率<strong>{{completion}}%</strong></span></div><button class="icon-btn" title="切換主題" @click="store.settings.theme=store.settings.theme==='dark'?'light':'dark'">{{store.settings.theme==='dark'?'☼':'◐'}}</button><button class="btn primary" @click="openNew">＋ 新增任務</button></div></header>
          <div class="content">
            <template v-if="page==='workbench'">
              <div class="page-head"><div><div class="eyebrow">MONDAY, YOUR TIME OVERVIEW</div><h1 class="page-title">排程工作台</h1><div class="page-desc">把今天要做的事排清楚，留出能專心完成的時間。</div></div><div class="filters"><input class="field" type="date" v-model="selectedDate"/><button class="btn" @click="selectedDate=iso(new Date())">回到今天</button></div></div>
              <div class="stat-grid"><div class="card stat-card"><div class="stat-top">今日排程工時 <span class="stat-icon">◷</span></div><div class="stat-value">{{hours(scheduledMinutes)}}</div><div class="stat-foot">{{todayTasks.length}} 個已排程任務</div></div><div class="card stat-card"><div class="stat-top">今日完成率 <span class="stat-icon">✓</span></div><div class="stat-value">{{completion}}<small style="font-size:14px">%</small></div><div class="stat-foot">完成 {{doneToday}} 項任務</div></div><div class="card stat-card"><div class="stat-top">本週實際投入 <span class="stat-icon">⌁</span></div><div class="stat-value">{{hours(actualTotal)}}</div><div class="stat-foot">依已完成任務紀錄</div></div><div class="card stat-card"><div class="stat-top">待辦任務 <span class="stat-icon">☷</span></div><div class="stat-value">{{store.tasks.filter(t=>t.status!=='done').length}}</div><div class="stat-foot">所有日期尚未完成</div></div></div>
              <div class="task-layout"><section class="card"><div class="section-head" style="padding:16px 16px 0"><h3>任務清單 <span class="muted" style="display:inline">{{selectedDate}}</span></h3><div class="filters"><input class="field" style="width:145px" placeholder="搜尋任務" v-model="search"/><select class="select" v-model="filterStatus"><option value="all">全部狀態</option><option value="todo">待辦</option><option value="in_progress">進行中</option><option value="done">已完成</option></select><select class="select" v-model="filterProject"><option value="all">全部專案</option><option v-for="p in projects" :key="p">{{p}}</option></select></div></div><div class="table-wrap"><table class="task-table"><thead><tr><th>任務 / 專案</th><th>時間</th><th>分類</th><th>預估</th><th>進度</th><th>狀態</th><th>操作</th></tr></thead><tbody><tr v-for="t in filteredTasks" :key="t.id"><td><div class="task-title">{{t.title}}</div><div class="muted">{{t.project}}</div></td><td>{{t.startTime}}–{{t.endTime}}</td><td>{{t.category}}</td><td>{{t.estimatedMinutes}} 分</td><td><span class="progress-track"><i :style="{width:t.progress+'%'}"></i></span>{{t.progress}}%</td><td><button class="badge" :class="t.status" @click="cycleStatus(t)">{{t.status==='todo'?'待辦':t.status==='in_progress'?'進行中':'已完成'}}</button></td><td><button class="btn" style="padding:5px 7px" @click="editTask(t)">編輯</button> <button class="btn danger" style="padding:5px 7px" @click="removeTask(t.id)">刪除</button></td></tr><tr v-if="!filteredTasks.length"><td colspan="7"><div class="empty">這一天還沒有符合條件的任務，新增一項開始安排吧。</div></td></tr></tbody></table></div></section>
                <aside class="task-side"><div class="card side-card"><h3>番茄鐘　<span class="badge">{{timerMode}}</span></h3><div class="timer-face"><div class="timer-time">{{timerText}}</div><div class="timer-label">{{timerMode==='專注'?'專注一件事，短暫休息再繼續':'離開螢幕，稍微活動一下'}}</div></div><div class="timer-actions"><button class="btn primary" @click="toggleTimer">{{timerRunning?'暫停':'開始'}}</button><button class="btn" @click="resetTimer">重設</button></div></div><div class="card side-card"><h3>接下來的任務</h3><div v-for="t in filteredTasks.filter(x=>x.status!=='done').slice(0,4)" :key="t.id" class="quick-task"><span class="dot"></span><div><div class="quick-task-title">{{t.title}}</div><div class="quick-task-meta">{{t.startTime}} · {{t.estimatedMinutes}} 分鐘</div></div></div><div v-if="!filteredTasks.some(x=>x.status!=='done')" class="empty" style="padding:16px 0">目前沒有待辦任務</div></div></aside></div>
            </template>
            <template v-else-if="page==='import_calendar'"><div class="page-head"><div><div class="eyebrow">IMPORTED SCHEDULE VIEW</div><h1 class="page-title">匯入日曆</h1><div class="page-desc">顯示所有已匯入的行程，不受工作台目前選取日期限制。</div></div><div class="filters"><button class="btn" @click="page='io_center'">前往匯入／匯出</button></div></div><div class="import-report" role="status" aria-live="polite">{{importReport}}</div><div class="import-calendar-layout"><aside class="card import-side"><div class="section-head"><h3>匯入資料</h3><span class="badge">{{importedTasks.length}} 筆</span></div><div class="import-stat"><span>本月行程</span><b>{{calendarMonthTasks.length}}</b></div><div class="import-stat"><span>未排時段</span><b>{{importedUnscheduled.length}}</b></div><div v-if="importedUnscheduled.length" class="import-unscheduled-list"><b>匯入待辦（未排時間）</b><div v-for="task in importedUnscheduled.slice(0,6)" :key="task.id"><span>{{task.title}}</span><small>{{task.deadline||task.date}}</small></div><small v-if="importedUnscheduled.length>6">另有 {{importedUnscheduled.length-6}} 筆</small></div><div class="import-category" v-for="cat in ['深度工作','會議協作','學習成長','行政瑣事','健康休息']" :key="cat"><span>{{cat}}</span><b>{{importedTasks.filter(t=>t.category===cat).length}}</b></div><p class="page-desc">匯入行程以紫藍標記；點日期查看當日明細。匯入資料仍保存在本機瀏覽器。</p><button class="btn primary" @click="page='io_center'">選擇／重新匯入檔案</button></aside><section class="card import-month"><div class="import-month-toolbar"><button class="btn" @click="moveImportMonth(-1)" aria-label="上個月">‹</button><h2>{{calendarMonth.getFullYear()}} 年 {{calendarMonth.getMonth()+1}} 月</h2><button class="btn" @click="moveImportMonth(1)" aria-label="下個月">›</button><button class="btn today-btn" @click="calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1,12);selectImportDate(iso(new Date()))">今天</button></div><div class="import-weekdays"><span v-for="w in ['一','二','三','四','五','六','日']" :key="w">{{w}}</span></div><div class="import-days"><div v-for="cell in calendarDates" :key="cell.date" class="import-day" :class="{outside:!cell.inMonth,today:cell.date===iso(new Date()),chosen:cell.date===calendarSelectedDate}" @click="selectImportDate(cell.date)"><span class="import-day-number">{{Number(cell.date.slice(8,10))}}</span><button v-for="task in importedForDate(cell.date).slice(0,3)" :key="task.id" class="import-event" @click.stop="selectImportDate(cell.date)" :title="task.title+' · '+task.startTime"><small>{{task.startTime}}</small><b>{{task.title}}</b></button><span v-if="importedForDate(cell.date).length>3" class="import-more">+{{importedForDate(cell.date).length-3}} 筆</span></div></div><div v-if="!importedTasks.length" class="empty import-empty">目前沒有匯入行程。<br/>請到「匯入與匯出」選擇 JSON 或 ICS；完成後會自動顯示在這個月曆。</div><section class="import-day-detail"><div class="section-head"><h3>{{calendarSelectedDate}} 的匯入行程</h3><span class="badge">{{selectedCalendarTasks.length}} 筆</span></div><div v-if="!selectedCalendarTasks.length" class="empty">這一天沒有匯入行程。可用上方箭頭切換月份或點選其他日期。</div><article v-for="task in selectedCalendarTasks" :key="task.id" class="import-detail-row"><time>{{task.startTime}}–{{task.endTime}}</time><div><b>{{task.title}}</b><small>{{task.project}} · {{task.category}} · {{task.status==='done'?'已完成':task.status==='in_progress'?'進行中':'待辦'}}{{task.importSource?' · '+task.importSource:''}}</small><p v-if="task.notes">{{task.notes}}</p></div><span v-if="task.importUnscheduled" class="badge">原未排時段</span></article></section></section></div></template>
            <template v-else-if="page==='dashboard'"><div id="dashboard-report"><div class="page-head"><div><div class="eyebrow">TIME & PROJECT INTELLIGENCE</div><h1 class="page-title">BI 戰情室</h1><div class="page-desc">從排程、實際投入與專注狀態，找出時間使用的模式。</div></div><div class="filters"><select class="select" v-model="period"><option value="today">選取日期</option><option value="week">近 7 天</option><option value="month">近 30 天</option><option value="all">全部紀錄</option></select><button class="btn" @click="exportPDF">匯出 PDF</button></div></div><div class="tabs"><button v-for="t in chartTabs" :key="t.id" class="tab" :class="{active:activeChartTab===t.id}" @click="activeChartTab=t.id">{{t.id==='X'?'進階診斷':t.id+'｜'+t.label}}</button></div><div v-if="!hasChartData" class="card empty chart-empty">所選日期範圍沒有行程資料；請匯入行程，或選取有資料的日期。</div><div v-else class="chart-grid"><div class="card chart-card" v-for="(item,i) in cards" :key="activeChartTab+'-'+i"><div class="chart-head"><div><div class="chart-title">{{item.title}}</div><div class="chart-sub">{{item.sub}}</div></div><button class="btn" style="padding:5px 8px;font-size:10px" @click="downloadChart(i)">下載 PNG</button></div><div :id="'chart-'+i" class="chart"></div></div></div></div></template>
            <template v-else-if="page==='formulas'"><div class="page-head"><div><div class="eyebrow">METRICS & METHODS</div><h1 class="page-title">公式計算中心</h1><div class="page-desc">保留原始紀錄、顯示計算依據；資料不足時不補造分數。</div></div><div class="filters"><input class="field" type="date" v-model="selectedDate"/></div></div>
              <div class="stat-grid"><div class="card stat-card"><div class="stat-top">當日已分配時間</div><div class="stat-value">{{hours(dayBudgetTotal)}}</div><div class="stat-foot">依互斥的主要活動分類</div></div><div class="card stat-card"><div class="stat-top">尚未分類</div><div class="stat-value">{{dayBudgetRemaining>=0?hours(dayBudgetRemaining):'超出'}}</div><div class="stat-foot">1,440 分鐘 − 已分配分鐘</div></div><div class="card stat-card"><div class="stat-top">平均估時偏差</div><div class="stat-value">{{meanEstimateBias===null?'—':Math.round(meanEstimateBias)+' 分'}}</div><div class="stat-foot">實際 − 預估；正值代表花得較久</div></div><div class="card stat-card"><div class="stat-top">平均絕對估時誤差</div><div class="stat-value">{{meanAbsoluteEstimateError===null?'—':Math.round(meanAbsoluteEstimateError)+'%'}}</div><div class="stat-foot">只計有預估及實際紀錄的完成任務</div></div></div>
              <div class="card section-card"><div class="section-head"><h3>每日 24 小時時間帳</h3><span class="badge">互斥主分類</span></div><p class="page-desc">每分鐘只選一個主要活動類別；同時做的事可留在任務標籤，不要重複加進分鐘總數。</p><div class="budget-grid"><div class="form-item" v-for="f in dayBudgetFields" :key="f.key"><label>{{f.label}}（分鐘）</label><input class="field" type="number" min="0" max="1440" step="5" v-model.number="dayBudgetDraft[f.key]"/></div></div><div class="budget-summary"><span>已分配 <b>{{dayBudgetTotal}}</b> 分</span><span :class="dayBudgetRemaining<0?'warning-text':''">{{dayBudgetRemaining>=0?'尚未分類':'超出每日總量'}} <b>{{Math.abs(dayBudgetRemaining)}}</b> 分</span><span>時間帳填寫率 <b>{{Math.min(100,Math.round(dayBudgetTotal/1440*100))}}%</b></span></div><div class="budget-grid" style="margin-top:14px"><div class="form-item"><label>活動前精力（1–5）</label><input class="field" type="number" min="1" max="5" v-model.number="dayBudgetDraft.energyStart"/></div><div class="form-item"><label>活動後精力（1–5）</label><input class="field" type="number" min="1" max="5" v-model.number="dayBudgetDraft.energyEnd"/></div><div class="form-item"><label>當日壓力自評（1–5）</label><input class="field" type="number" min="1" max="5" v-model.number="dayBudgetDraft.stress"/></div></div><div class="budget-summary"><span>精力變化（後 − 前） <b>{{Number(dayBudgetDraft.energyEnd)-Number(dayBudgetDraft.energyStart)}}</b></span><span class="muted">自評紀錄，不是生理測量</span></div><button class="btn primary" style="margin-top:14px" :disabled="dayBudgetTotal>1440" @click="saveDayBudget">儲存 {{selectedDate}} 的紀錄</button></div>
              <div class="card section-card"><div class="section-head"><h3>指標定義</h3><span class="badge">工具衍生指標</span></div><div class="formula-row"><div class="formula-name">估時偏差</div><div class="formula-code">實際分鐘 − 預估分鐘；正值代表低估</div><div class="formula-value">{{meanEstimateBias===null?'資料不足':Math.round(meanEstimateBias)+' 分'}}</div></div><div class="formula-row"><div class="formula-name">絕對估時誤差率</div><div class="formula-code">|實際 − 預估| ÷ 預估 × 100%</div><div class="formula-value">{{meanAbsoluteEstimateError===null?'資料不足':Math.round(meanAbsoluteEstimateError)+'%'}}</div></div><div class="formula-row"><div class="formula-name">24 小時未分類</div><div class="formula-code">1,440 − 各互斥活動類別分鐘總和</div><div class="formula-value">{{dayBudgetRemaining>=0?dayBudgetRemaining+' 分':'請調整超額紀錄'}}</div></div><div class="formula-row"><div class="formula-name">精力變化</div><div class="formula-code">活動後自評 − 活動前自評</div><div class="formula-value">{{Number(dayBudgetDraft.energyEnd)-Number(dayBudgetDraft.energyStart)}}</div></div><p class="page-desc">估時公式是工具衍生指標，不是通用生產力分數；請累積同類任務紀錄後再解讀。</p></div>
            </template>

            <template v-else-if="page==='observations'"><div class="page-head"><div><div class="eyebrow">ACTIVITY & INTERRUPTION DIARY · PHASE 2</div><h1 class="page-title">觀察紀錄</h1><div class="page-desc">一筆記錄代表一段連續活動。若中斷後離開原任務，請另開新段；中斷分鐘與恢復時間分開填。</div></div><div class="filters"><input class="field" type="date" v-model="selectedDate"/></div></div><div class="stat-grid"><div class="card stat-card"><div class="stat-top">觀察活動段</div><div class="stat-value">{{dayLogStats.count}}</div><div class="stat-foot">只計有填寫的紀錄</div></div><div class="card stat-card"><div class="stat-top">紀錄時段合計</div><div class="stat-value">{{hours(dayLogStats.minutes)}}</div><div class="stat-foot">時段長度，不等於淨投入時間</div></div><div class="card stat-card"><div class="stat-top">中斷／恢復</div><div class="stat-value">{{dayLogStats.interruptions}} 次</div><div class="stat-foot">中斷 {{dayLogStats.interruptionMinutes}} 分；恢復 {{dayLogStats.resumptionMinutes}} 分；切換 {{dayLogStats.switchCount}} 次</div></div><div class="card stat-card"><div class="stat-top">最長記錄段</div><div class="stat-value">{{dayLogStats.longest}} 分</div><div class="stat-foot">平均專注自評 {{dayLogStats.avgFocus??'—'}} / 5；不代表成效</div></div></div><div class="card section-card"><div class="section-head"><h3>新增一段觀察紀錄</h3><span class="badge">自我觀察，不是診斷量表</span></div><div class="log-grid"><div class="form-item"><label>活動／任務名稱</label><input class="field" v-model="logDraft.title" placeholder="例如：讀英文文章"/></div><div class="form-item"><label>觀察分類</label><select class="select" v-model="logDraft.timeType"><option value="leisure">玩樂／休閒</option><option value="long_block">長時間區塊</option><option value="focus_now">專注當下</option><option value="fragmented">零散時間</option><option value="shallow_provisional">淺淺意識（暫定）</option><option value="other">其他</option></select></div><div class="form-item"><label>日期</label><input class="field" type="date" v-model="logDraft.date"/></div><div class="form-item"><label>開始至結束</label><div class="inline-fields"><input class="field" type="time" v-model="logDraft.startTime"/><input class="field" type="time" v-model="logDraft.endTime"/></div></div><div class="form-item"><label>情境／任務類型</label><input class="field" v-model="logDraft.context" placeholder="選填"/></div><div class="form-item"><label>專注／難度（1–5）</label><div class="inline-fields"><input class="field" type="number" min="1" max="5" v-model.number="logDraft.focusRating"/><input class="field" type="number" min="1" max="5" v-model.number="logDraft.difficulty"/></div></div><div class="form-item"><label>開始／結束精力（1–5）</label><div class="inline-fields"><input class="field" type="number" min="1" max="5" v-model.number="logDraft.energyBefore"/><input class="field" type="number" min="1" max="5" v-model.number="logDraft.energyAfter"/></div></div><div class="form-item"><label>滿意度（1–5）</label><input class="field" type="number" min="1" max="5" v-model.number="logDraft.satisfaction"/></div><div class="form-item"><label>中斷次數／分鐘</label><div class="inline-fields"><input class="field" type="number" min="0" v-model.number="logDraft.interruptions"/><input class="field" type="number" min="0" v-model.number="logDraft.interruptionMinutes"/></div></div><div class="form-item"><label>恢復原任務所需分鐘</label><input class="field" type="number" min="0" v-model.number="logDraft.resumptionMinutes"/></div><div class="form-item"><label>任務切換次數／來源</label><div class="inline-fields"><input class="field" type="number" min="0" v-model.number="logDraft.switchCount"/><input class="field" v-model="logDraft.switchSource" placeholder="自發／外部／必要"/></div></div><div class="form-item"><label>期限來源</label><select class="select" v-model="logDraft.deadlineKind"><option value="none">無</option><option value="external">外部期限</option><option value="self">自訂期限</option></select></div><div class="form-item"><label>期限改期次數</label><input class="field" type="number" min="0" v-model.number="logDraft.deadlineChangedCount"/></div><div class="form-item full"><label>改期原因／備註</label><textarea class="field" rows="2" v-model="logDraft.note" placeholder="例如：臨時課務、估時不足、主動調整；可留空"></textarea></div></div><div class="modal-actions"><button class="btn primary" @click="saveActivityLog">儲存紀錄</button></div></div><div class="card section-card"><div class="section-head"><h3>{{selectedDate}} 的觀察紀錄</h3><span class="badge">{{dayLogs.length}} 段</span></div><div v-if="!dayLogs.length" class="empty">尚無紀錄。可從一兩段活動開始，不必追求整天都記到。</div><div v-else class="log-list"><article class="log-row" v-for="item in dayLogs" :key="item.id"><div><b>{{item.title}}</b><div class="muted">{{timeTypeLabels[item.timeType]}} · {{item.context||'未分類情境'}}</div></div><div>{{item.startTime}}–{{item.endTime}}（{{logDuration(item)}} 分）</div><div class="muted">專注 {{item.focusRating}}/5 · 中斷 {{item.interruptions}} 次 · 切換 {{item.switchCount}} 次</div><button class="btn danger" @click="removeActivityLog(item.id)">刪除</button></article></div></div><div class="card section-card"><div class="section-head"><h3>閱讀這些數字時</h3><span class="badge">操作定義</span></div><div class="knowledge-note-grid"><div><b>記錄時段</b><p>由開始到結束的經過時間；若需淨工作時間，必須自行扣除已知的離席與中斷，避免重複扣減。</p></div><div><b>專注抽樣</b><p>1–5 是本工具的自評欄位，不是經驗證量表，也不會推算成精確專注分鐘。</p></div><div><b>短段與切換</b><p>零散只作描述；必要的短段、課程與休息不自動判定為浪費或干擾。</p></div></div></div></template>
            <template v-else-if="page==='review'"><div class="page-head"><div><div class="eyebrow">PERSONAL REVIEW · PHASE 3</div><h1 class="page-title">趨勢回顧</h1><div class="page-desc">用自己留下的觀察紀錄找模式；樣本少時先累積，不把相關性當成原因。</div></div><div class="filters"><label class="muted">回顧區間</label><select class="select" v-model.number="reviewWindow"><option :value="7">最近 7 天</option><option :value="14">最近 14 天</option><option :value="30">最近 30 天</option></select><label class="muted">截至</label><input class="field" type="date" v-model="selectedDate"/></div></div><div class="stat-grid"><div class="card stat-card"><div class="stat-top">觀察紀錄</div><div class="stat-value">{{reviewStats.count}} 段</div><div class="stat-foot">分布在 {{reviewStats.days}} 天</div></div><div class="card stat-card"><div class="stat-top">紀錄時段合計</div><div class="stat-value">{{hours(reviewStats.minutes)}}</div><div class="stat-foot">不是淨專注時間</div></div><div class="card stat-card"><div class="stat-top">平均專注自評</div><div class="stat-value">{{reviewStats.avgFocus??'—'}} / 5</div><div class="stat-foot">每段等權平均，非量表分數</div></div><div class="card stat-card"><div class="stat-top">中斷／切換</div><div class="stat-value">{{reviewStats.interruptions}} / {{reviewStats.switches}}</div><div class="stat-foot">恢復時間合計 {{reviewStats.resumptionMinutes}} 分</div></div></div><div class="review-grid"><div class="card section-card"><div class="section-head"><h3>每日紀錄時段</h3><span class="badge">{{reviewStart}} 至 {{selectedDate}}</span></div><div v-if="!reviewStats.count" class="empty">這段期間沒有紀錄。新增幾段後，這裡會呈現每天的觀察量。</div><div v-else class="daily-bars"><div class="daily-bar" v-for="d in dailyReview" :key="d.date" :title="d.date+'：'+d.minutes+' 分、'+d.count+' 段、平均專注 '+(d.avgFocus??'無紀錄')"><div class="bar-value">{{d.count?hours(d.minutes):''}}</div><div class="bar-track"><i :style="{height:(d.minutes/reviewMaxMinutes*100)+'%'}"></i></div><b>{{d.label}}</b><small>{{d.count?d.count+' 段':'—'}}</small></div></div><p class="page-desc">直條只表示已記錄時段相加；若時段重疊會重複計算，沒有紀錄的日期也不代表沒有活動。</p></div><div class="card section-card"><div class="section-head"><h3>回顧提示</h3><span class="badge">描述性規則</span></div><div v-if="!reviewHints.length" class="empty">尚無足夠資料。</div><div v-else class="hint-list"><article class="hint-card" v-for="(hint,i) in reviewHints" :key="i"><b>{{hint.title}}</b><p>{{hint.text}}</p></article></div><div v-if="reviewStats.interruptionsPerHour!==null" class="page-desc">觀察中斷率＝中斷次數 ÷ 紀錄時段小時數（{{reviewStats.interruptionsPerHour}} 次／小時）；僅供個人紀錄比較。</div></div></div><div class="card section-card"><div class="section-head"><h3>依活動類型比較</h3><span class="badge">保留樣本數</span></div><div class="table-wrap"><table class="task-table review-table"><thead><tr><th>類型</th><th>紀錄段數</th><th>時段合計</th><th>專注自評平均</th><th>滿意度平均</th><th>中斷數</th></tr></thead><tbody><tr v-for="x in typeReview" :key="x.type"><td><div class="task-title">{{x.label}}</div></td><td>{{x.count}}</td><td>{{hours(x.minutes)}}</td><td>{{x.avgFocus}} / 5</td><td>{{x.avgSatisfaction}} / 5</td><td>{{x.interruptions}}</td></tr><tr v-if="!typeReview.length"><td colspan="6"><div class="empty">選定區間還沒有觀察紀錄。</div></td></tr></tbody></table></div><p class="page-desc">不同類型的平均只作描述；每筆紀錄權重相同，任務難度、情境與時段可能不同。樣本少於 3 段時先不要做強比較。若同一時間記了多個類型，時段總和會重複計入。</p></div><div class="card section-card"><div class="section-head"><h3>有改期紀錄的任務</h3><span class="badge">{{deadlineReview.length}} 項</span></div><div v-if="!deadlineReview.length" class="empty">目前沒有已保存改期次數的任務。</div><div v-else class="deadline-list"><article v-for="t in deadlineReview" :key="t.id"><div><b>{{t.title}}</b><div class="muted">{{t.kind==='external'?'外部期限':'自訂期限'}} · 新期限 {{t.deadline||'未設定'}}</div></div><strong>{{t.count}} 次改期</strong><span class="muted">{{t.reason}}</span></article></div><p class="page-desc">改期次數不是拖延程度；需一起看任務變動、外部事件與期限來源。</p></div><div class="card section-card"><div class="section-head"><h3>使用限制</h3><span class="badge">讀數前</span></div><p class="page-desc">本頁是本地紀錄的簡單描述統計，不做因果判斷、診斷或學業成效預測。自評題目不是經驗證量表；若改了評分方式，前後資料也不宜直接比較。回顧日期依上方「截至」日期。</p></div></template>
            <template v-else-if="page==='knowledge'"><div class="page-head"><div><div class="eyebrow">RESEARCH KNOWLEDGE BASE · PHASE 1</div><h1 class="page-title">時間研究知識庫</h1><div class="page-desc">分清研究構念、測量方式與工具公式；淺淺意識、真假 deadline 保留為暫定分類。</div></div></div><div class="card section-card"><div class="section-head"><h3>公式來源標籤</h3><span class="badge">使用前先看</span></div><div class="knowledge-note-grid"><div><b>研究原始測量</b><p>論文實際使用的問卷、時間日誌或行為紀錄，保留原定義與計分方法。</p></div><div><b>驗證量表</b><p>依指定版本和分量表計分；改題、改量尺或翻譯後不自動沿用效度。</p></div><div><b>工具衍生指標</b><p>為程式計算所訂的公式，明確標為本工具定義，不寫成學界定律。</p></div></div></div><div class="knowledge-grid"><article class="card knowledge-card" v-for="topic in researchTopics" :key="topic.id"><div class="knowledge-card-head"><h2>{{topic.title}}</h2><span class="badge">{{topic.status}}</span></div><p><b>研究概念</b><br/>{{topic.definition}}</p><p><b>測量建議</b><br/>{{topic.measure}}</p><p><b>可用公式</b><br/><code>{{topic.formula}}</code></p><p><b>公式性質</b><br/>{{topic.formulaType}}</p><p><b>注意</b><br/>{{topic.caution}}</p><div class="source-list"><b>參考研究</b><a v-for="src in topic.sources" :key="src.url" :href="src.url" target="_blank" rel="noopener noreferrer">{{src.label}} ↗</a></div></article></div><div class="card section-card"><div class="section-head"><h3>第一階段資料原則</h3></div><p class="page-desc">每日 24 小時帳以互斥的主要活動分類加總；專注、恢復、任務複雜度等另外作為狀態或標籤。時間、主觀感受、任務品質分開保存，不合成未經驗證的總分。</p></div></template>
            <template v-else-if="page==='io_center'"><div class="page-head"><div><div class="eyebrow">DATA PORTABILITY</div><h1 class="page-title">匯入與匯出中心</h1><div class="page-desc">備份任務資料，或與行事曆交換排程。</div><div class="import-report" role="status" aria-live="polite">{{importReport}}</div></div></div><div class="chart-grid"><div class="card section-card"><div class="section-head"><h3>完整備份</h3><span class="badge">JSON</span></div><p class="page-desc">備份全部任務、設定與本機紀錄。匯入時會先檢查資料結構。</p><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn primary" @click="saveJSON">下載 JSON 備份</button><label class="btn">選擇 JSON 匯入／還原<input type="file" accept="application/json,.json" hidden @change="importJSON"/></label></div></div><div class="card section-card"><div class="section-head"><h3>行事曆交換</h3><span class="badge">ICS / CSV</span></div><p class="page-desc">匯出標準 iCalendar 或 CSV；也可以匯入 .ics 事件成為待辦任務。</p><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" @click="exportICS">匯出 .ics</button><button class="btn" @click="exportCSV">匯出任務 CSV</button><button class="btn" @click="exportActivityCSV">匯出觀察紀錄 CSV</button><label class="btn">匯入 .ics<input type="file" accept=".ics,text/calendar" hidden @change="importICS"/></label></div></div><div class="card section-card"><div class="section-head"><h3>戰情室報告</h3><span class="badge">PDF</span></div><p class="page-desc">將目前圖表頁匯出為 PDF。請先進入 BI 戰情室，再選擇匯出。</p><button class="btn" style="margin-top:16px" @click="page='dashboard';notify('進入戰情室後可匯出 PDF')">開啟戰情室</button></div><div class="card section-card"><div class="section-head"><h3>範例資料</h3><span class="badge">14 天示例</span></div><p class="page-desc">重新載入內建任務與範例設定，會取代目前的任務資料。</p><button class="btn danger" style="margin-top:16px" @click="resetAll">重置為範例資料</button></div></div></template>
            <template v-else><div class="page-head"><div><div class="eyebrow">START FROM A SIMPLE ROUTINE</div><h1 class="page-title">時間管理範本庫</h1><div class="page-desc">選一個可修改的起點，再依課表與體力調整。</div></div></div><div class="chart-grid"><div class="card section-card" v-for="(name,i) in ['學期平衡週','轉學考讀書日','低負荷恢復日']" :key="name"><div class="section-head"><h3>{{name}}</h3><span class="badge">範本 0{{i+1}}</span></div><p class="page-desc">{{i===0?'安排深度學習、課程整理與休息，讓一週有穩定節奏。':i===1?'以微積分、管理學與錯題整理為主軸，保留不同時段切換。':'降低安排密度，留出檢視與恢復空間。'}}</p><button class="btn primary" style="margin-top:17px" @click="applyTemplate(name)">套用至{{selectedDate}}</button></div></div><div class="card section-card" style="margin-top:15px"><div class="section-head"><h3>使用原則</h3></div><p class="page-desc">範本會新增任務，不會覆蓋既有排程。套用後可在工作台編輯、刪除或調整時間。</p></div></template>
          </div>
        </main>
        <div v-if="showModal" class="modal-backdrop" @click.self="showModal=false"><div class="modal"><h2>{{editId?'編輯任務':'新增任務'}}</h2><div class="form-grid"><div class="form-item full"><label>任務名稱</label><input class="field" v-model="draft.title" placeholder="例如：微積分定積分練習" @keyup.enter="saveTask"/></div><div class="form-item"><label>專案</label><input class="field" v-model="draft.project" list="projects-list"/><datalist id="projects-list"><option v-for="p in projects" :key="p" :value="p"/></datalist></div><div class="form-item"><label>分類</label><select class="select" v-model="draft.category"><option>深度工作</option><option>會議協作</option><option>學習成長</option><option>行政瑣事</option><option>健康休息</option></select></div><div class="form-item"><label>日期</label><input class="field" type="date" v-model="draft.date"/></div><div class="form-item"><label>開始時間</label><input class="field" type="time" v-model="draft.startTime"/></div><div class="form-item"><label>預估分鐘</label><input class="field" type="number" min="5" step="5" v-model.number="draft.estimatedMinutes"/></div><div class="form-item"><label>狀態</label><select class="select" v-model="draft.status"><option value="todo">待辦</option><option value="in_progress">進行中</option><option value="done">已完成</option></select></div><div class="form-item"><label>期限日期</label><input class="field" type="date" v-model="draft.deadline"/></div><div class="form-item"><label>期限來源</label><select class="select" v-model="draft.deadlineKind"><option value="external">外部期限</option><option value="self">自訂期限</option></select></div><div class="form-item"><label>期限改期次數</label><input class="field" type="number" min="0" v-model.number="draft.deadlineChangedCount"/></div><div class="form-item"><label>改期原因</label><input class="field" v-model="draft.delayReason" placeholder="選填"/></div><div class="form-item"><label>重要度 / 緊急度</label><div style="display:flex;gap:7px"><input class="field" type="number" min="1" max="10" v-model.number="draft.importance" title="重要度"/><input class="field" type="number" min="1" max="10" v-model.number="draft.urgency" title="緊急度"/></div></div><div class="form-item"><label>規劃方式</label><select class="select" v-model="draft.isProactive"><option :value="true">主動規劃</option><option :value="false">臨時插單</option></select></div></div><div class="modal-actions"><button class="btn" @click="showModal=false">取消</button><button class="btn primary" @click="saveTask">儲存任務</button></div></div></div>
        <div v-if="toast" class="toast">{{toast}}</div>
      </div>`
  });
  app.mount('#app');
})();
</script>
</body>
</html>
