<script>
(() => {
  const { createApp, reactive, computed, ref, onMounted, onBeforeUnmount, watch, nextTick } = Vue;
  const STORAGE_KEY = 'TIME_PRO_ENTERPRISE_V1';
  const today = new Date();
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const shiftDate = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
  const makeTask = (i, offset, title, project, category, start, duration, status, extra={}) => ({
    id:`seed-${i}`, title, project, category, tags:extra.tags||[], date:shiftDate(offset), startTime:start,
    endTime:minutesToTime(timeToMinutes(start)+duration), deadline:shiftDate(Math.max(offset,0)+((i%5)+1)),
    isMilestone:i%8===0, dependencies:[], estimatedMinutes:duration+(i%3-1)*10, actualMinutes:status==='done'?duration+(i%4-1)*8:0,
    bufferMinutes:15, overrunReason:i%7===0?'低估難度':'無', importance:4+(i%7), urgency:3+(i%8), valueScore:4+(i%7), isProactive:i%4!==0,
    createdAt:shiftDate(offset-((i%5)+1)), difficulty:3+(i%7), skillLevel:4+(i%6), energyLevel:4+(i%6), focusScore:56+(i*7)%44,
    pomodoroCompleted:status==='done'?Math.max(1,Math.round(duration/25)):0, pomodoroInterrupted:i%4===0?1:0, contextSwitches:i%4,
    distractionSource:['無','通訊軟體','臨時會議','郵件','疲勞','環境噪音'][i%6], sleepHours:6+(i%4)*0.6,
    status, progress:status==='done'?100:status==='in_progress'?Math.min(80,25+(i%4)*15):0, okrGoal:i%3===0?'轉學考準備':'學期穩定學習', ...extra
  });
  function timeToMinutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}
  function minutesToTime(m){m=((m%1440)+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}
  function seedData(){
    const rows=[
      ['微積分極限題練習','轉學考','學習成長','08:00',90,'done'],['管理學章節複習','課業','學習成長','10:00',60,'done'],['工業工程概論預習','課業','學習成長','13:30',75,'in_progress'],
      ['整理本週課程筆記','課業','深度工作','15:00',60,'todo'],['社團會議','校園','會議協作','18:00',60,'done'],['早晨規劃與回顧','個人','行政瑣事','07:30',25,'done'],
      ['微積分積分題型','轉學考','學習成長','09:00',110,'done'],['英文閱讀練習','課業','深度工作','11:30',45,'done'],['計概資料結構複習','課業','學習成長','14:00',90,'in_progress'],
      ['運動與伸展','健康','健康休息','17:00',40,'done'],['管理學題庫練習','課業','深度工作','19:00',60,'todo'],['轉學考科目盤點','轉學考','行政瑣事','20:30',35,'done'],
      ['工概作業整理','課業','深度工作','08:30',80,'done'],['微積分錯題訂正','轉學考','學習成長','10:30',75,'in_progress'],['系上專題討論','專題','會議協作','13:00',60,'done'],
      ['英文單字複習','課業','學習成長','16:00',35,'done'],['午休與散步','健康','健康休息','12:00',40,'done'],['計概作業','課業','深度工作','19:30',90,'todo'],
      ['每週檢討','個人','行政瑣事','20:00',40,'done'],['微積分定積分練習','轉學考','深度工作','09:00',100,'done'],['課堂報告資料搜尋','課業','深度工作','14:30',80,'in_progress'],
      ['校務行政處理','個人','行政瑣事','16:00',30,'done'],['管理學概念圖','課業','學習成長','18:30',60,'todo'],['睡前放鬆','健康','健康休息','21:30',30,'done'],
      ['工管課程複習','課業','學習成長','08:00',70,'done'],['微積分小考準備','轉學考','深度工作','10:00',120,'in_progress'],['讀書會討論','讀書會','會議協作','15:00',60,'done']
    ];
    const tasks=rows.map((r,i)=>makeTask(i+1,-13+(i%14),...r,{tags:i%2?['課堂']:['自主學習']}));
    const dailyRecords=Object.fromEntries(Array.from({length:14},(_,i)=>{
      const date=shiftDate(i-13),dayTasks=tasks.filter(t=>t.date===date);
      return [date,{checkIn:true,focusMinutes:dayTasks.filter(t=>t.category==='深度工作'||t.category==='學習成長').reduce((s,t)=>s+t.actualMinutes,0),exerciseMinutes:dayTasks.filter(t=>t.category==='健康休息').reduce((s,t)=>s+t.actualMinutes,0),sleepHours:dayTasks.length?+(dayTasks.reduce((s,t)=>s+t.sleepHours,0)/dayTasks.length).toFixed(1):7.2}];
    }));
    return {tasks, dailyRecords, settings:{theme:'light',pomodoroMinutes:25,breakMinutes:5,okrs:{'轉學考準備':420,'學期穩定學習':260}}};
  }
  function validTask(t){
    const strings=['id','title','project','category','date','startTime','endTime','deadline','overrunReason','distractionSource','status','okrGoal'];
    const numbers=['estimatedMinutes','actualMinutes','bufferMinutes','importance','urgency','valueScore','difficulty','skillLevel','energyLevel','focusScore','pomodoroCompleted','pomodoroInterrupted','contextSwitches','sleepHours','progress'];
    return !!t&&strings.every(k=>typeof t[k]==='string')&&numbers.every(k=>Number.isFinite(Number(t[k])))&&
      /^\d{4}-\d{2}-\d{2}$/.test(t.date)&&/^\d{2}:\d{2}$/.test(t.startTime)&&/^\d{2}:\d{2}$/.test(t.endTime)&&
      ['深度工作','會議協作','學習成長','行政瑣事','健康休息'].includes(t.category)&&['todo','in_progress','done'].includes(t.status)&&
      Array.isArray(t.tags)&&Array.isArray(t.dependencies)&&typeof t.isMilestone==='boolean'&&typeof t.isProactive==='boolean'&&
      t.importance>=1&&t.importance<=10&&t.urgency>=1&&t.urgency<=10&&t.progress>=0&&t.progress<=100&&
      t.estimatedMinutes>=0&&t.actualMinutes>=0&&t.focusScore>=0&&t.focusScore<=100;
  }
  function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&Array.isArray(x.tasks)&&x.tasks.every(validTask))return {...seedData(),...x}}catch(e){}return seedData()}
  const store=reactive(loadState());
  watch(store,()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(store)),{deep:true});
  const app=createApp({
    setup(){
      const page=ref('workbench'), collapsed=ref(false), showModal=ref(false), editId=ref(null), activeChartTab=ref('A'), period=ref('week'), filterStatus=ref('all'), filterProject=ref('all'), search=ref(''), selectedDate=ref(iso(today)), toast=ref(''), timerSeconds=ref(25*60), timerRunning=ref(false), timerMode=ref('專注'), timerInterval=ref(null), chartInstances=[];
      const draft=reactive({title:'',project:'課業',category:'學習成長',date:iso(today),startTime:'09:00',estimatedMinutes:60,importance:5,urgency:5,status:'todo',isProactive:true});
      const nav=[{id:'workbench',icon:'▦',label:'排程工作台'},{id:'dashboard',icon:'◫',label:'BI 戰情室'},{id:'formulas',icon:'ƒ',label:'公式中心'},{id:'io_center',icon:'⇅',label:'匯入與匯出'},{id:'templates',icon:'▤',label:'範本庫'}];
      const chartTabs=[{id:'A',label:'排程進度'},{id:'B',label:'時間結構'},{id:'C',label:'估時與決策'},{id:'D',label:'專注與生理時鐘'},{id:'E',label:'個人 KPI'},{id:'X',label:'進階診斷'}];
      const scopedTasks=computed(()=>{
        const t=store.tasks.filter(x=>period.value==='all'||(period.value==='today'?x.date===selectedDate.value:period.value==='week'?x.date>=shiftDate(-6)&&x.date<=shiftDate(0):x.date>=shiftDate(-29)&&x.date<=shiftDate(0)));
        return t;
      });
      const todayTasks=computed(()=>store.tasks.filter(x=>x.date===selectedDate.value));
      const filteredTasks=computed(()=>todayTasks.value.filter(t=>(filterStatus.value==='all'||t.status===filterStatus.value)&&(filterProject.value==='all'||t.project===filterProject.value)&&(!search.value||`${t.title} ${t.project} ${t.category}`.toLowerCase().includes(search.value.toLowerCase()))).sort((a,b)=>a.startTime.localeCompare(b.startTime)));
      const projects=computed(()=>[...new Set(store.tasks.map(t=>t.project))]);
      const doneToday=computed(()=>todayTasks.value.filter(t=>t.status==='done').length);
      const completion=computed(()=>todayTasks.value.length?Math.round(doneToday.value/todayTasks.value.length*100):0);
      const scheduledMinutes=computed(()=>todayTasks.value.reduce((s,t)=>s+t.estimatedMinutes,0));
      const actualTotal=computed(()=>scopedTasks.value.reduce((s,t)=>s+(t.actualMinutes||0),0));
      const hours=(m)=>`${(m/60).toFixed(1)}h`;
      const timerText=computed(()=>`${String(Math.floor(timerSeconds.value/60)).padStart(2,'0')}:${String(timerSeconds.value%60).padStart(2,'0')}`);
      function notify(msg){toast.value=msg;setTimeout(()=>toast.value='',2600)}
      function resetDraft(){Object.assign(draft,{title:'',project:'課業',category:'學習成長',date:selectedDate.value,startTime:'09:00',estimatedMinutes:60,importance:5,urgency:5,status:'todo',isProactive:true});editId.value=null}
      function openNew(){resetDraft();showModal.value=true}
      function editTask(t){Object.assign(draft,{title:t.title,project:t.project,category:t.category,date:t.date,startTime:t.startTime,estimatedMinutes:t.estimatedMinutes,importance:t.importance,urgency:t.urgency,status:t.status,isProactive:t.isProactive});editId.value=t.id;showModal.value=true}
      function saveTask(){if(!draft.title.trim()){notify('請輸入任務名稱');return}const duration=Math.max(5,Number(draft.estimatedMinutes)||60);if(editId.value){const t=store.tasks.find(x=>x.id===editId.value);Object.assign(t,draft,{estimatedMinutes:duration,endTime:minutesToTime(timeToMinutes(draft.startTime)+duration)})}else{store.tasks.push({...makeTask(Date.now(),0,draft.title,draft.project,draft.category,draft.startTime,duration,draft.status),...draft,id:crypto.randomUUID?.()||String(Date.now()),endTime:minutesToTime(timeToMinutes(draft.startTime)+duration),createdAt:iso(today),actualMinutes:0,progress:draft.status==='done'?100:0})}showModal.value=false;notify(editId.value?'任務已更新':'任務已新增')}
      function removeTask(id){if(!confirm('確定刪除這項任務？'))return;store.tasks=store.tasks.filter(t=>t.id!==id);notify('任務已刪除')}
      function cycleStatus(t){const states=['todo','in_progress','done'];const n=states[(states.indexOf(t.status)+1)%states.length];t.status=n;t.progress=n==='done'?100:n==='in_progress'?50:0;if(n==='done'&&!t.actualMinutes)t.actualMinutes=t.estimatedMinutes;notify('狀態已更新')}

      function importJSON(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.tasks)||!x.tasks.every(validTask))throw Error('資料格式不符合');store.tasks=x.tasks;store.dailyRecords=x.dailyRecords||{};store.settings={...store.settings,...x.settings};notify('資料已匯入')}catch(err){notify('匯入失敗：請確認 JSON 格式')}e.target.value=''};r.readAsText(f)}
      function exportCSV(){const header=['id','title','project','category','date','startTime','endTime','estimatedMinutes','actualMinutes','status','importance','urgency'];const lines=[header.join(','),...store.tasks.map(t=>header.map(k=>JSON.stringify(t[k]??'')).join(','))];downloadBlob(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'tasks.csv');notify('CSV 已下載')}
      function exportICS(){const fmt=(d,t)=>`${d.replaceAll('-','')}T${t.replace(':','')}00`;const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Chrono Desk//Time Manager//ZH-TW'];store.tasks.forEach(t=>lines.push('BEGIN:VEVENT',`UID:${t.id}@chronodesk`,`DTSTART:${fmt(t.date,t.startTime)}`,`DTEND:${fmt(t.date,t.endTime)}`,`SUMMARY:${t.title.replace(/[,;\\]/g,' ')}`,`DESCRIPTION:${t.project} / ${t.category}`,`STATUS:${t.status==='done'?'CONFIRMED':'TENTATIVE'}`,'END:VEVENT'));lines.push('END:VCALENDAR');downloadBlob(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'chronodesk.ics');notify('iCalendar 已下載')}
      function importICS(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const text=String(r.result);const events=text.split('BEGIN:VEVENT').slice(1);let added=0;events.forEach((ev,i)=>{const get=k=>ev.match(new RegExp('(?:^|\\n)'+k+'[^:]*:([^\\r\\n]+)'))?.[1]?.trim();const s=get('DTSTART'),en=get('DTEND'),title=get('SUMMARY');if(!s||!title)return;const date=`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`,start=`${s.slice(9,11)}:${s.slice(11,13)}`,endMin=en?Number(en.slice(9,11))*60+Number(en.slice(11,13)):timeToMinutes(start)+60;store.tasks.push({...makeTask(Date.now()+i,0,title,'匯入行事曆','行政瑣事',start,Math.max(15,endMin-timeToMinutes(start)),'todo'),id:crypto.randomUUID?.()||String(Date.now()+i),date,endTime:minutesToTime(endMin)});added++});notify(`已匯入 ${added} 筆行事曆事件`);e.target.value=''};r.readAsText(f)}
      async function exportPDF(){if(!window.html2pdf){notify('PDF 元件載入失敗，請檢查網路後重試');return}const el=document.getElementById('dashboard-report');if(!el){notify('請先開啟戰情室');return}await html2pdf().set({margin:8,filename:'chrono-desk-report.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:1.5,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}}).from(el).save();notify('PDF 報表已下載')}
      function resetAll(){if(!confirm('將以範例資料取代目前資料，確定嗎？'))return;const d=seedData();store.tasks=d.tasks;store.settings=d.settings;store.dailyRecords={};notify('已重置範例資料')}
      function applyTemplate(name){const templates={學期平衡週:[['深度學習時段','學習成長','09:00',90],['課程整理','行政瑣事','14:00',45],['運動與休息','健康休息','17:00',40]],轉學考讀書日:[['微積分練習','深度工作','08:30',100],['管理學回想測驗','學習成長','13:30',60],['錯題訂正','深度工作','19:00',60]],低負荷恢復日:[['本週檢視','行政瑣事','10:00',30],['散步與伸展','健康休息','16:00',40]]};(templates[name]||[]).forEach((r,i)=>store.tasks.push({...makeTask(Date.now()+i,0,r[0],'個人計畫',r[1],r[2],r[3],'todo'),id:crypto.randomUUID?.()||String(Date.now()+i),date:selectedDate.value}));notify(`${name}已套用`);page.value='workbench'}
      function onResize(){chartInstances.forEach(c=>c.resize())}
      watch([page,activeChartTab,period,selectedDate],()=>{if(page.value==='dashboard')drawCharts()});
      watch(()=>store.tasks,()=>{if(page.value==='dashboard')drawCharts()},{deep:true});
      onMounted(()=>{window.addEventListener('resize',onResize);if(page.value==='dashboard')drawCharts()});
      onBeforeUnmount(()=>{window.removeEventListener('resize',onResize);clearInterval(timerInterval.value);chartInstances.forEach(c=>c.dispose())});
      return {store,page,collapsed,showModal,draft,editId,nav,chartTabs,activeChartTab,period,filterStatus,filterProject,search,selectedDate,toast,timerSeconds,timerRunning,timerMode,timerText,scopedTasks,todayTasks,filteredTasks,projects,doneToday,completion,scheduledMinutes,actualTotal,hours,cards,openNew,editTask,saveTask,removeTask,cycleStatus,toggleTimer,resetTimer,downloadChart,saveJSON,importJSON,exportCSV,exportICS,importICS,exportPDF,resetAll,applyTemplate,notify,chartInstances};
    },
    template:`
      <div class="app" :class="{dark:store.settings.theme==='dark'}">
        <aside class="sidebar" :class="{collapsed}">
          <div class="brand"><div class="brand-mark">◷</div><span class="brand-name">Chrono Desk</span></div>
          <div class="nav-label">工作空間</div>
          <button v-for="n in nav" :key="n.id" class="nav-btn" :class="{active:page===n.id}" @click="page=n.id"><span class="nav-icon">{{n.icon}}</span><span class="nav-text">{{n.label}}</span></button>
          <div class="side-bottom"><button class="nav-btn" @click="collapsed=!collapsed"><span class="nav-icon">{{collapsed?'⇥':'⇤'}}</span><span class="nav-text">收合側欄</span></button><div class="side-help">Chrono Desk<br/>把時間安排，變成看得見的進度。</div></div>
        </aside>
        <main class="main">
          <header class="topbar"><div class="crumb">工作空間　/　<b>{{nav.find(n=>n.id===page)?.label}}</b></div><div class="top-actions"><div class="top-kpi"><span>今日任務<strong>{{doneToday}} / {{todayTasks.length}}</strong></span><span>完成率<strong>{{completion}}%</strong></span></div><button class="icon-btn" title="切換主題" @click="store.settings.theme=store.settings.theme==='dark'?'light':'dark'">{{store.settings.theme==='dark'?'☼':'◐'}}</button><button class="btn primary" @click="openNew">＋ 新增任務</button></div></header>
          <div class="content">
            <template v-if="page==='workbench'">
              <div class="page-head"><div><div class="eyebrow">MONDAY, YOUR TIME OVERVIEW</div><h1 class="page-title">排程工作台</h1><div class="page-desc">把今天要做的事排清楚，留出能專心完成的時間。</div></div><div class="filters"><input class="field" type="date" v-model="selectedDate"/><button class="btn" @click="selectedDate=new Date().toISOString().slice(0,10)">回到今天</button></div></div>
              <div class="stat-grid"><div class="card stat-card"><div class="stat-top">今日排程工時 <span class="stat-icon">◷</span></div><div class="stat-value">{{hours(scheduledMinutes)}}</div><div class="stat-foot">{{todayTasks.length}} 個已排程任務</div></div><div class="card stat-card"><div class="stat-top">今日完成率 <span class="stat-icon">✓</span></div><div class="stat-value">{{completion}}<small style="font-size:14px">%</small></div><div class="stat-foot">完成 {{doneToday}} 項任務</div></div><div class="card stat-card"><div class="stat-top">本週實際投入 <span class="stat-icon">⌁</span></div><div class="stat-value">{{hours(actualTotal)}}</div><div class="stat-foot">依已完成任務紀錄</div></div><div class="card stat-card"><div class="stat-top">待辦任務 <span class="stat-icon">☷</span></div><div class="stat-value">{{store.tasks.filter(t=>t.status!=='done').length}}</div><div class="stat-foot">所有日期尚未完成</div></div></div>
              <div class="task-layout"><section class="card"><div class="section-head" style="padding:16px 16px 0"><h3>任務清單 <span class="muted" style="display:inline">{{selectedDate}}</span></h3><div class="filters"><input class="field" style="width:145px" placeholder="搜尋任務" v-model="search"/><select class="select" v-model="filterStatus"><option value="all">全部狀態</option><option value="todo">待辦</option><option value="in_progress">進行中</option><option value="done">已完成</option></select><select class="select" v-model="filterProject"><option value="all">全部專案</option><option v-for="p in projects" :key="p">{{p}}</option></select></div></div><div class="table-wrap"><table class="task-table"><thead><tr><th>任務 / 專案</th><th>時間</th><th>分類</th><th>預估</th><th>進度</th><th>狀態</th><th>操作</th></tr></thead><tbody><tr v-for="t in filteredTasks" :key="t.id"><td><div class="task-title">{{t.title}}</div><div class="muted">{{t.project}}</div></td><td>{{t.startTime}}–{{t.endTime}}</td><td>{{t.category}}</td><td>{{t.estimatedMinutes}} 分</td><td><span class="progress-track"><i :style="{width:t.progress+'%'}"></i></span>{{t.progress}}%</td><td><button class="badge" :class="t.status" @click="cycleStatus(t)">{{t.status==='todo'?'待辦':t.status==='in_progress'?'進行中':'已完成'}}</button></td><td><button class="btn" style="padding:5px 7px" @click="editTask(t)">編輯</button> <button class="btn danger" style="padding:5px 7px" @click="removeTask(t.id)">刪除</button></td></tr><tr v-if="!filteredTasks.length"><td colspan="7"><div class="empty">這一天還沒有符合條件的任務，新增一項開始安排吧。</div></td></tr></tbody></table></div></section>
                <aside class="task-side"><div class="card side-card"><h3>番茄鐘　<span class="badge">{{timerMode}}</span></h3><div class="timer-face"><div class="timer-time">{{timerText}}</div><div class="timer-label">{{timerMode==='專注'?'專注一件事，短暫休息再繼續':'離開螢幕，稍微活動一下'}}</div></div><div class="timer-actions"><button class="btn primary" @click="toggleTimer">{{timerRunning?'暫停':'開始'}}</button><button class="btn" @click="resetTimer">重設</button></div></div><div class="card side-card"><h3>接下來的任務</h3><div v-for="t in filteredTasks.filter(x=>x.status!=='done').slice(0,4)" :key="t.id" class="quick-task"><span class="dot"></span><div><div class="quick-task-title">{{t.title}}</div><div class="quick-task-meta">{{t.startTime}} · {{t.estimatedMinutes}} 分鐘</div></div></div><div v-if="!filteredTasks.some(x=>x.status!=='done')" class="empty" style="padding:16px 0">目前沒有待辦任務</div></div></aside></div>
            </template>
            <template v-else-if="page==='dashboard'"><div id="dashboard-report"><div class="page-head"><div><div class="eyebrow">TIME & PROJECT INTELLIGENCE</div><h1 class="page-title">BI 戰情室</h1><div class="page-desc">從排程、實際投入與專注狀態，找出時間使用的模式。</div></div><div class="filters"><select class="select" v-model="period"><option value="today">選取日期</option><option value="week">近 7 天</option><option value="month">近 30 天</option><option value="all">全部紀錄</option></select><button class="btn" @click="exportPDF">匯出 PDF</button></div></div><div class="tabs"><button v-for="t in chartTabs" :key="t.id" class="tab" :class="{active:activeChartTab===t.id}" @click="activeChartTab=t.id">{{t.id==='X'?'進階診斷':t.id+'｜'+t.label}}</button></div><div class="chart-grid"><div class="card chart-card" v-for="(item,i) in cards" :key="activeChartTab+'-'+i"><div class="chart-head"><div><div class="chart-title">{{item.title}}</div><div class="chart-sub">{{item.sub}}</div></div><button class="btn" style="padding:5px 8px;font-size:10px" @click="downloadChart(i)">下載 PNG</button></div><div :id="'chart-'+i" class="chart"></div></div></div></div></template>
            <template v-else-if="page==='formulas'"><div class="page-head"><div><div class="eyebrow">METRICS & METHODS</div><h1 class="page-title">公式計算中心</h1><div class="page-desc">指標以任務資料即時計算；紀錄不足時會顯示目前可用的結果。</div></div></div><div class="stat-grid"><div class="card stat-card"><div class="stat-top">估時準確度</div><div class="stat-value">{{Math.max(0,100-Math.round(scopedTasks.filter(t=>t.status==='done').length?scopedTasks.filter(t=>t.status==='done').reduce((s,t)=>s+Math.abs(t.actualMinutes-t.estimatedMinutes)/Math.max(t.estimatedMinutes,1)*100,0)/scopedTasks.filter(t=>t.status==='done').length:0))}}%</div><div class="stat-foot">已完成任務的平均估時誤差</div></div><div class="card stat-card"><div class="stat-top">主動規劃比</div><div class="stat-value">{{scopedTasks.length?Math.round(scopedTasks.filter(t=>t.isProactive).length/scopedTasks.length*100):0}}%</div><div class="stat-foot">主動安排任務占比</div></div><div class="card stat-card"><div class="stat-top">平均專注度</div><div class="stat-value">{{Math.round(scopedTasks.length?scopedTasks.reduce((s,t)=>s+t.focusScore,0)/scopedTasks.length:0)}}<small style="font-size:14px">/100</small></div><div class="stat-foot">任務紀錄的 focusScore 平均</div></div><div class="card stat-card"><div class="stat-top">尚未完成估計工時</div><div class="stat-value">{{hours(store.tasks.filter(t=>t.status!=='done').reduce((s,t)=>s+t.estimatedMinutes,0))}}</div><div class="stat-foot">全部未完成任務</div></div></div><div class="card section-card"><div class="section-head"><h3>指標定義</h3><span class="badge">動態計算</span></div><div class="formula-row"><div class="formula-name">完成率</div><div class="formula-code">已完成任務數 ÷ 任務總數 × 100%</div><div class="formula-value">{{completion}}%</div></div><div class="formula-row"><div class="formula-name">估時準確度</div><div class="formula-code">max(0, 100 − 平均絕對偏差率)</div><div class="formula-value">{{Math.max(0,100-Math.round(scopedTasks.filter(t=>t.status==='done').length?scopedTasks.filter(t=>t.status==='done').reduce((s,t)=>s+Math.abs(t.actualMinutes-t.estimatedMinutes)/Math.max(t.estimatedMinutes,1)*100,0)/scopedTasks.filter(t=>t.status==='done').length:0))}}%</div></div><div class="formula-row"><div class="formula-name">時間負債</div><div class="formula-code">未完成任務的預估分鐘數總和</div><div class="formula-value">{{hours(store.tasks.filter(t=>t.status!=='done').reduce((s,t)=>s+t.estimatedMinutes,0))}}</div></div><div class="formula-row"><div class="formula-name">主動規劃比</div><div class="formula-code">主動規劃任務 ÷ 所有任務 × 100%</div><div class="formula-value">{{scopedTasks.length?Math.round(scopedTasks.filter(t=>t.isProactive).length/scopedTasks.length*100):0}}%</div></div></div></template>
            <template v-else-if="page==='io_center'"><div class="page-head"><div><div class="eyebrow">DATA PORTABILITY</div><h1 class="page-title">匯入與匯出中心</h1><div class="page-desc">備份任務資料，或與行事曆交換排程。</div></div></div><div class="chart-grid"><div class="card section-card"><div class="section-head"><h3>完整備份</h3><span class="badge">JSON</span></div><p class="page-desc">備份全部任務、設定與本機紀錄。匯入時會先檢查資料結構。</p><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn primary" @click="saveJSON">下載 JSON 備份</button><label class="btn">選擇 JSON 還原<input type="file" accept="application/json,.json" hidden @change="importJSON"/></label></div></div><div class="card section-card"><div class="section-head"><h3>行事曆交換</h3><span class="badge">ICS / CSV</span></div><p class="page-desc">匯出標準 iCalendar 或 CSV；也可以匯入 .ics 事件成為待辦任務。</p><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" @click="exportICS">匯出 .ics</button><button class="btn" @click="exportCSV">匯出 .csv</button><label class="btn">匯入 .ics<input type="file" accept=".ics,text/calendar" hidden @change="importICS"/></label></div></div><div class="card section-card"><div class="section-head"><h3>戰情室報告</h3><span class="badge">PDF</span></div><p class="page-desc">將目前圖表頁匯出為 PDF。請先進入 BI 戰情室，再選擇匯出。</p><button class="btn" style="margin-top:16px" @click="page='dashboard';notify('進入戰情室後可匯出 PDF')">開啟戰情室</button></div><div class="card section-card"><div class="section-head"><h3>範例資料</h3><span class="badge">14 天示例</span></div><p class="page-desc">重新載入內建任務與範例設定，會取代目前的任務資料。</p><button class="btn danger" style="margin-top:16px" @click="resetAll">重置為範例資料</button></div></div></template>

          </div>
        </main>
        <div v-if="showModal" class="modal-backdrop" @click.self="showModal=false"><div class="modal"><h2>{{editId?'編輯任務':'新增任務'}}</h2><div class="form-grid"><div class="form-item full"><label>任務名稱</label><input class="field" v-model="draft.title" placeholder="例如：微積分定積分練習" @keyup.enter="saveTask"/></div><div class="form-item"><label>專案</label><input class="field" v-model="draft.project" list="projects-list"/><datalist id="projects-list"><option v-for="p in projects" :key="p" :value="p"/></datalist></div><div class="form-item"><label>分類</label><select class="select" v-model="draft.category"><option>深度工作</option><option>會議協作</option><option>學習成長</option><option>行政瑣事</option><option>健康休息</option></select></div><div class="form-item"><label>日期</label><input class="field" type="date" v-model="draft.date"/></div><div class="form-item"><label>開始時間</label><input class="field" type="time" v-model="draft.startTime"/></div><div class="form-item"><label>預估分鐘</label><input class="field" type="number" min="5" step="5" v-model.number="draft.estimatedMinutes"/></div><div class="form-item"><label>狀態</label><select class="select" v-model="draft.status"><option value="todo">待辦</option><option value="in_progress">進行中</option><option value="done">已完成</option></select></div><div class="form-item"><label>重要度 / 緊急度</label><div style="display:flex;gap:7px"><input class="field" type="number" min="1" max="10" v-model.number="draft.importance" title="重要度"/><input class="field" type="number" min="1" max="10" v-model.number="draft.urgency" title="緊急度"/></div></div><div class="form-item"><label>規劃方式</label><select class="select" v-model="draft.isProactive"><option :value="true">主動規劃</option><option :value="false">臨時插單</option></select></div></div><div class="modal-actions"><button class="btn" @click="showModal=false">取消</button><button class="btn primary" @click="saveTask">儲存任務</button></div></div></div>
        <div v-if="toast" class="toast">{{toast}}</div>
      </div>`
  });
  app.mount('#app');
})();
