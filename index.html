<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrono Planner｜正式入口</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; color: #1d2939; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    main { width: min(760px, calc(100% - 32px)); margin: 10vh auto; }
    .card { background: #fff; border: 1px solid #e1e7ef; border-radius: 18px; padding: clamp(24px, 5vw, 48px); box-shadow: 0 12px 35px rgba(31, 49, 74, .08); }
    .eyebrow { color: #5377b8; font-size: .8rem; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: .45rem 0 .7rem; font-size: clamp(2rem, 6vw, 3.2rem); }
    p { color: #58677d; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
    a { display: inline-block; border-radius: 10px; padding: 12px 16px; text-decoration: none; font-weight: 700; }
    .primary { background: #0a84ff; color: #fff; }
    .secondary { border: 1px solid #cdd8e7; color: #294a77; }
    ul { color: #58677d; line-height: 1.7; padding-left: 1.2rem; }
    code { background: #eef3fa; border-radius: 4px; padding: .1em .3em; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="eyebrow">CHRONO PLANNER · OFFLINE RELEASE</div>
      <h1>個人時間管理工具</h1>
      <p>正式使用入口是離線單檔版。它不使用 CDN，可直接儲存在 Mac 後以瀏覽器開啟；資料只保存在目前瀏覽器，請定期匯出 JSON 備份。</p>
      <div class="actions">
        <a class="primary" href="apps/chrono-planner/ChronoPlanner-可直接開啟.html" download>下載／開啟離線單檔版</a>
        <a class="secondary" href="apps/chrono-planner/README.md">閱讀操作與開發說明</a>
      </div>
      <ul>
        <li>開發版：<code>apps/chrono-planner/index.html</code>，請透過 HTTP 伺服器開啟。</li>
        <li>來源：<code>apps/chrono-planner/src/</code>；執行 <code>npm test</code> 會重建離線單檔並執行測試。</li>
        <li><code>ChronoDesk-整合版.html</code> 是舊相容性材料，不是正式使用入口。</li>
      </ul>
    </section>
  </main>
</body>
</html>
